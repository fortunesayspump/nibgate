name: Publish testnet private guest image

on:
  push:
    branches:
      - testnet/privacy-guest-image

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 worker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dr-nib/private-guest.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fortunesayspump/nibgate-private-guest:git-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/fortunesayspump/nibgate

      - name: Report immutable digest
        run: echo "ghcr.io/fortunesayspump/nibgate-private-guest@${{ steps.build.outputs.digest }}"
