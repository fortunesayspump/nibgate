<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nibgate post template — dark</title>
<style>
  @font-face {
    font-family: 'ABC Favorit';
    src: url('../frontend/public/fonts/ABCFavorit-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'ABC Favorit';
    src: url('../frontend/public/fonts/ABCFavorit-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }
  @font-face {
    font-family: 'Kumbh Sans';
    src: url('../frontend/public/fonts/kumbh/KumbhSans-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: 'Kumbh Sans';
    src: url('../frontend/public/fonts/kumbh/KumbhSans-SemiBold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
  }
  @font-face {
    font-family: 'Kumbh Sans';
    src: url('../frontend/public/fonts/kumbh/KumbhSans-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }

  :root {
    --nib-ink: #f3efe7;
    --nib-page-bg: #171813;
    --nib-surface: #20221c;
    --nib-surface-soft: #242820;
    --nib-olive: #a9c69a;
    --nib-olive-deep: #7c9a6d;
    --nib-plum: #b7a9e8;
    --nib-teal: #67c8bd;
    --nib-muted: #b9b2a6;
    --nib-faint: #8f8879;
    --nib-soft: #243326;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Kumbh Sans', 'ABC Favorit', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--nib-page-bg);
    color: var(--nib-ink);
  }

  .frame {
    width: 1200px;
    height: 630px;
    background: var(--nib-page-bg);
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    height: 4px;
    width: 100%;
    background: var(--nib-olive);
  }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 64px;
    position: relative;
    overflow: hidden;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    color: var(--nib-olive);
  }

  .brand-mark svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .brand-name {
    font-family: 'Kumbh Sans', 'ABC Favorit', sans-serif;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--nib-olive);
  }

  h1 {
    font-family: 'Kumbh Sans', 'ABC Favorit', sans-serif;
    font-size: 92px;
    font-weight: 700;
    letter-spacing: -0.055em;
    line-height: 0.92;
    color: var(--nib-ink);
    max-width: 820px;
  }

  .subhead {
    margin-top: 22px;
    font-family: 'ABC Favorit', 'Kumbh Sans', Arial, sans-serif;
    font-size: 26px;
    font-weight: 400;
    line-height: 1.2;
    color: var(--nib-muted);
    max-width: 720px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 36px;
  }

  .pill {
    font-family: 'Kumbh Sans', 'ABC Favorit', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0;
    color: #10110e;
    background: var(--nib-olive);
    border-radius: 999px;
    padding: 9px 20px;
  }

  .pill--ghost {
    background: transparent;
    color: var(--nib-olive);
    border: 1px solid rgba(169, 198, 154, 0.42);
  }

  .flower {
    position: absolute;
    right: -70px;
    bottom: -30px;
    width: 520px;
    height: 420px;
    color: var(--nib-olive);
    opacity: 0.85;
    pointer-events: none;
  }

  .flower .outline {
    display: block;
    width: 100%;
    height: 100%;
    -webkit-mask: url('../frontend/public/illustrations/hero-flower.svg') center / contain no-repeat;
    mask: url('../frontend/public/illustrations/hero-flower.svg') center / contain no-repeat;
    background: rgba(243, 239, 231, 0.16);
  }

  .flower .fill {
    position: absolute;
    inset: 0;
    -webkit-mask: url('../frontend/public/illustrations/hero-flower.svg') center / contain no-repeat;
    mask: url('../frontend/public/illustrations/hero-flower.svg') center / contain no-repeat;
    background: var(--nib-olive);
    transform: translate(5px, 5px);
    opacity: 0.85;
  }

  .footer {
    height: 56px;
    background: #10110e;
    border-top: 1px solid rgba(243, 239, 231, 0.06);
    display: flex;
    align-items: center;
    padding: 0 64px;
    font-family: 'Kumbh Sans', 'ABC Favorit', sans-serif;
    font-size: 16px;
    color: var(--nib-faint);
    gap: 8px;
  }

  .footer .handle {
    color: var(--nib-olive);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top-bar"></div>

    <div class="content">
      <div class="flower" aria-hidden="true">
        <span class="fill"></span>
        <span class="outline"></span>
      </div>

      <div class="brand-row">
        <span class="brand-mark">
          <img src="../frontend/public/brand/nibgate-mark.svg" alt="" width="34" height="34">
        </span>
        <span class="brand-name">nibgate</span>
      </div>

      <h1>Headline goes<br>here</h1>

      <p class="subhead">One-line subhead. Verified paid content, on your site.</p>

      <div class="meta-row">
        <span class="pill">nibgate.xyz</span>
        <span class="pill pill--ghost">@nibgate</span>
      </div>
    </div>

    <div class="footer">
      <span>nibgate.xyz</span>
      <span>·</span>
      <span>docs.nibgate.xyz</span>
      <span>·</span>
      <span class="handle">@nibgate</span>
    </div>
  </div>
</body>
</html>
