<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" role="img" aria-labelledby="title desc"><title id="title">Dr. Nib private research architecture</title><desc id="desc">The browser encrypts content and verifies the Phala worker. The ordinary broker and storage handle ciphertext. Phala orchestrates research, using verified primary inference and disclosed hosted JEV or Azure ZDR routes. Public tools and payments receive approved arguments and metadata.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59664c"/></marker></defs><rect width="1000" height="625" rx="20" fill="#f4f5ef"/><g fill="none" stroke="#59664c" stroke-width="2" marker-end="url(#arrow)"><path d="M500 120V160"/><path d="M500 250V290"/><path d="M300 205H265" marker-start="url(#arrow)"/><path d="M300 335H265" marker-start="url(#arrow)"/><path d="M700 335H735" marker-start="url(#arrow)"/><path d="M500 380V410H180V445"/><path d="M500 410V445"/><path d="M500 410H820V445"/><path d="M700 75H720V305H700" stroke-dasharray="6 5"/></g><rect x="300" y="30" width="400" height="90" rx="12" fill="#ffffff" stroke="#b8c0ab"/><text x="500.0" y="60" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Browser</text><text x="500.0" y="86" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Encrypt inputs · unlock vault · verify worker</text><rect x="300" y="160" width="400" height="90" rx="12" fill="#ffffff" stroke="#b8c0ab"/><text x="500.0" y="190" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Ciphertext broker</text><text x="500.0" y="216" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Account ownership · encrypted delivery</text><rect x="300" y="290" width="400" height="90" rx="12" fill="#ffffff" stroke="#b8c0ab"/><text x="500.0" y="320" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Verified Phala worker</text><text x="500.0" y="346" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Decrypt · research · encrypt results</text><rect x="20" y="160" width="245" height="90" rx="12" fill="#ffffff" stroke="#b8c0ab"/><text x="142.5" y="190" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Postgres / private R2</text><text x="142.5" y="216" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Encrypted project state</text><rect x="20" y="290" width="245" height="90" rx="12" fill="#ffffff" stroke="#b8c0ab"/><text x="142.5" y="320" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Public tools / Hub</text><text x="142.5" y="346" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Approved queries and URLs</text><rect x="735" y="290" width="245" height="90" rx="12" fill="#ffffff" stroke="#b8c0ab"/><text x="857.5" y="320" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Money service</text><text x="857.5" y="346" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Payments and receipts</text><rect x="30" y="445" width="300" height="115" rx="12" fill="#ffffff" stroke="#b8c0ab"/><text x="180.0" y="475" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Phala inference</text><text x="180.0" y="501" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Verified primary model</text><text x="180.0" y="524" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Receipt-reported usage</text><rect x="350" y="445" width="300" height="115" rx="12" fill="#fff2de" stroke="#b39563"/><text x="500.0" y="475" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">JEV via TypeSafe</text><text x="500.0" y="501" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Disclosed hosted context</text><text x="500.0" y="524" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">OpenRouter ZDR</text><rect x="670" y="445" width="300" height="115" rx="12" fill="#fff2de" stroke="#b39563"/><text x="820.0" y="475" text-anchor="middle" fill="#20271e" font-family="Arial, sans-serif" font-size="21" font-weight="600">Azure fallback</text><text x="820.0" y="501" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Disclosed research context</text><text x="820.0" y="524" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">OpenRouter ZDR</text><text x="735" y="130" fill="#46503f" font-family="Arial, sans-serif" font-size="16">Verified encrypted</text><text x="735" y="152" fill="#46503f" font-family="Arial, sans-serif" font-size="16">project-key delivery</text><text x="500" y="600" text-anchor="middle" fill="#46503f" font-family="Arial, sans-serif" font-size="17">Hosted ZDR routes process the context sent to them. Ordinary storage holds ciphertext.</text></svg>
