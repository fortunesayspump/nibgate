# Railway service: Dr. Nib backend.
#
# Set this service's Root Directory to dr-nib/backend. Railway checks out the
# whole repo, so pnpm still finds the workspace root two levels up and resolves
# dr-nib's `@nibgate/internal` workspace dependency.
#
# Start runs generate + migrate + serve, so the first deploy creates the schema
# and every later deploy applies new migrations. Migrations are tracked in the
# `drnib` schema named by DRNIB_DATABASE_URL.
[build]
builder = "nixpacks"
watchPatterns = [
  "dr-nib/**",
  "packages/internal/**",
  "packages/nibgate/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm --filter @nibgate/dr-nib-backend start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
