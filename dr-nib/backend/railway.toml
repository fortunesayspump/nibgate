# Railway service: Dr. Nib backend.
#
# Use the repository root as the service root so the shared lockfile and
# workspace packages are in the build context. Scope the start command below.
#
# Start runs generate + serve without changing the database schema. Fresh
# installs and schema upgrades require a separately reviewed migration step
# against the `drnib` schema named by DRNIB_DATABASE_URL before deployment.
[build]
builder = "railpack"
watchPatterns = [
  "dr-nib/**",
  "packages/internal/**",
  "packages/nibgate/**",
  "packages/wallet/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm --filter @nibgate/dr-nib-backend start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
