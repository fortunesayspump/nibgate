# Optional Railway frontend deployment: use the repository as service root.
[build]
buildCommand = "pnpm --filter nibgate-blog-frontend build"
watchPatterns = [
  "subblogs/frontend/**",
  "packages/nibgate/**",
  "packages/wallet/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm --filter nibgate-blog-frontend start"
